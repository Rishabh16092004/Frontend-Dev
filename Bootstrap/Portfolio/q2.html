<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<!-- ================= HEADER ================= -->
<header class="container text-center mt-4 mb-4">
    <h1 class="fw-bold">Rishabh Jaiswal</h1>
    <p class="lead text-secondary">Full-Stack Developer | Creative Designer</p>
</header>

<!-- ================= PROFILE SECTION ================= -->
<main class="container text-center">

    <!-- Profile Image -->
    <!-- .img-fluid = responsive image, .rounded-circle = circular -->
    <img
            src="https://via.placeholder.com/200"
            alt="Profile Photo"
            class="img-fluid rounded-circle mb-3 shadow"
            width="200"
    />

    <!-- Buttons -->
    <!-- Bootstrap buttons + spacing utilities -->
    <div class="mt-3 mb-4">
        <a href="#" class="btn btn-primary me-2">Hire Me</a>
        <a href="#" class="btn btn-outline-dark">Download CV</a>
    </div>

    <!-- About Section -->
    <section class="p-5 bg-white shadow-sm rounded mb-5">
        <h2 class="fw-bold mb-3">About Me</h2>
        <p class="text-secondary">
            I am a passionate full-stack developer who loves building modern,
            responsive web applications. I specialize in MERN stack and enjoy
            designing clean, user-friendly interfaces.
        </p>
    </section>

    <!-- ================= CONTACT FORM ================= -->
    <section class="p-5 bg-white shadow-sm rounded mb-5">
        <h2 class="fw-bold mb-3">Contact Me</h2>

        <form class="mx-auto" style="max-width: 500px;">

            <!-- Name field -->
            <!-- .form-control adds Bootstrap styling -->
            <div class="mb-3">
                <input
                        type="text"
                        placeholder="Your Name"
                        class="form-control"
                />
            </div>

            <!-- Email field -->
            <div class="mb-3">
                <input
                        type="email"
                        placeholder="Your Email"
                        class="form-control"
                />
            </div>

            <!-- Message field -->
            <div class="mb-3">
          <textarea
                  class="form-control"
                  rows="4"
                  placeholder="Your Message"
          ></textarea>
            </div>

            <button class="btn btn-success w-100">Send Message</button>
        </form>
    </section>

</main>

<footer class="text-center py-3 text-secondary">
    © 2025 My Portfolio
</footer>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
