<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CSS -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />

    <link rel="stylesheet" href="q3.css">
</head>
<body class="bg-light">

<!-- ================= Header ================= -->
<header class="text-center py-4">
    <h1 class="fw-bold">Our Products</h1>
    <p class="text-secondary">Browse our latest collection</p>
</header>

<!-- ================= Product Grid ================= -->
<main class="container pb-5">

    <!-- .row = grid container -->
    <div class="row g-4">

        <!-- Each product uses Bootstrap responsive columns:
             col-12 → 1 column on mobile
             col-sm-6 → 2 columns on tablets
             col-md-3 → 4 columns on desktops
        -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://sp.yimg.com/ib/th?id=OPAC.GCqzARceTynu0g474C474&o=5&pid=21.1&w=174&h=174" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Stylish Headphones</h5>
                    <p class="text-muted mb-2">₹2,499</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcR1mrWw0n53-KdQg0q8CHMqHBme3iIz6Y-a0IX7TQOEEGvOWwHZc2foqJXqIm-gXpa4uxaVT6hKERgZDJBj371j7uXhJIMs7IQkzZxrq_xOLXKS6EZfhO6v_kvEGjO606MGOwEcuvrqRw&usqp=CAc" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="text-muted mb-2">₹3,999</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcSMSNrXRqsafrjjuRIpnOZ3cJbQnpltpiPnCq_jhBMyXJYq7TTU6ZgI1IuXnq3CaTn79hurolJhut8KaOh-Sr-bQ6mtjkSVrdD_IF45v0ilawe-OT6JWdTa6Q" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Bluetooth Speaker</h5>
                    <p class="text-muted mb-2">₹1,799</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card product-card shadow-sm">
                <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcQBm59r68qwHdHnNXfl4whnY94Mn4m01iyU3qUsd0ArBzNhCG-BT9VbYFlP2jIGykuGbqjz4QBdKZMceksrkejnsmXnbhLiM4jYnD01uk4FQy0vYXhfQFkm" class="card-img-top" alt="Product">
                <div class="card-body text-center">
                    <h5 class="card-title">Wireless Mouse</h5>
                    <p class="text-muted mb-2">₹799</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
