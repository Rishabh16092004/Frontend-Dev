<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles Summary</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

<main class="principle-container">

    <section class="principle-box">
        <h2>Fluid Layouts</h2>
        <p>Layouts that use percentage-based widths to adjust automatically.</p>
        <code>width: 80%;</code>
    </section>

    <section class="principle-box">
        <h2>Flexible Media</h2>
        <p>Images and videos scale smoothly within containers.</p>
        <code>img { max-width: 100%; }</code>
    </section>

    <section class="principle-box">
        <h2>Breakpoints</h2>
        <p>Media queries adjust layout for different screen sizes.</p>
        <code>@media(max-width: 600px)</code>
    </section>

</main>

</body>
</html>
