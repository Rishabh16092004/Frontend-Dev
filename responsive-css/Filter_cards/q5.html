<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

<main class="card-container">
    <section class="card">
        <img src="https://via.placeholder.com/200" alt="Profile 1">
        <h2>Person One</h2>
        <p>Front-end Developer</p>
    </section>

    <section class="card">
        <img src="https://via.placeholder.com/200" alt="Profile 2">
        <h2>Person Two</h2>
        <p>UI/UX Designer</p>
    </section>

    <section class="card">
        <img src="https://via.placeholder.com/200" alt="Profile 3">
        <h2>Person Three</h2>
        <p>Software Engineer</p>
    </section>
</main>

</body>
</html>
