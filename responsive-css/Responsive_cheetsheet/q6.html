<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive CSS Cheat Sheet</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>

<main class="cheat-container">

    <section class="cheat-box">
        <h2>Filters</h2>
        <p>Example: <code>filter: grayscale(100%);</code></p>
    </section>

    <section class="cheat-box">
        <h2>Media Queries</h2>
        <p>Example: <code>@media(max-width: 600px)</code></p>
    </section>

    <section class="cheat-box">
        <h2>Responsive Design</h2>
        <p>Use flexible units: %, rem, vw, clamp()</p>
    </section>

    <section class="cheat-box">
        <h2>Typography</h2>
        <p>Example: <code>font-size: clamp(1rem, 2vw, 2rem);</code></p>
    </section>

</main>

</body>
</html>
