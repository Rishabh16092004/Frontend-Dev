<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gradient Background — Demonstration</title>
    <link rel="stylesheet" href="GradientBackground.css">
</head>
<body>
<header class="site-header">
    <h1>Gradient Background Webpage</h1>
</header>

<main>
    <!-- Section 1: Linear Gradient -->
    <section class="gradient-section linear-gradient">
        <div class="content">
            <h2>Linear Gradient Background</h2>
            <p>This section uses a <strong>linear gradient</strong> flowing from top to bottom.</p>
        </div>
    </section>

    <!-- Section 2: Radial Gradient with Parallax-like effect -->
    <section class="gradient-section radial-gradient">
        <div class="content">
            <h2>Radial Gradient Background</h2>
            <p>This section features a <strong>radial gradient</strong> with <em>background-attachment: fixed</em>, creating a parallax-like feel.</p>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>&copy; Demonstration — Gradient Backgrounds</p>
</footer>
</body>
</html>
