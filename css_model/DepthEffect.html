<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shadows & Depth Effect Layout</title>
    <link rel="stylesheet" href="depthEffect.css">
</head>
<body>
<header class="site-header">
    <h1>Shadows & Depth Effect Layout</h1>
</header>


<main>
    <section class="card-container" aria-label="Shadow effect cards">
        <!-- Card 1 -->
        <article class="card card-light">
            <h2>Soft Shadow</h2>
            <p>Uses a light, subtle shadow to create gentle elevation.</p>
        </article>


        <!-- Card 2 -->
        <article class="card card-medium">
            <h2>Medium Shadow</h2>
            <p>Balanced shadow for moderate depth and focus.</p>
        </article>


        <!-- Card 3 -->
        <article class="card card-strong">
            <h2>Strong Shadow</h2>
            <p>Bold shadow to emphasize importance and prominence.</p>
        </article>
    </section>
</main>


<footer class="site-footer">
    <p>&copy; Demonstration — Shadows and Depth Effects</p>
</footer>
</body>
</html>
