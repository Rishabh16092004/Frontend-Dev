<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Highlight</title>
    <link rel="stylesheet" href="style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="Product_Highlight.js"></script>
</head>
<body>

<header>
    <h2>Product List</h2>
</header>

<main class="product-container">

    <!-- Product cards -->
    <div class="product" data-stock="out" data-discount="20">
        <h3>Smartphone</h3>
        <p class="details">RAM: 8GB, 128GB Storage</p>
        <span class="fav"></span>
    </div>

    <div class="product" data-stock="in" data-discount="10">
        <h3>Headphones</h3>
        <p class="details">Noise Cancellation</p>
        <span class="fav">️</span>
    </div>

    <div class="product" data-stock="in">
        <h3>Laptop</h3>
        <p class="details">i5, 16GB RAM, 512GB SSD</p>
        <span class="fav"></span>
    </div>

    <div class="product" data-stock="out">
        <h3>Smart Watch</h3>
        <p class="details">AMOLED Display</p>
        <span class="fav"></span>
    </div>

    <div class="product" data-stock="in" data-discount="15">
        <h3>Bluetooth Speaker</h3>
        <p class="details">20W Output</p>
        <span class="fav"></span>
    </div>

</main>

</body>
</html>
