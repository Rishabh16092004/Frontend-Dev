<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offer Banners</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="Special_Offer_Banner.js"></script>
</head>
<body>

<header>
    <h2>Special Offers</h2>
</header>

<section id="bannerContainer">
    <div class="banner"> 50% OFF on Electronics</div>
    <div class="banner"> Buy 1 Get 1 Free on Headphones</div>
    <div class="banner"> Laptop Exchange Bonus Offer</div>
    <div class="banner"> Smartphone Festival Sale</div>
    <div class="banner"> Flat 30% OFF on Smart Watches</div>
</section>

<div class="controls">
    <button id="hideBtn">Hide Banners</button>
    <button id="showBtn">Show Banners</button>
    <button id="slideBtn">Slide Up/Down</button>
    <button id="fadeBtn">Fade In/Out</button>
</div>

</body>
</html>
