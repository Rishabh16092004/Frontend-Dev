<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: #f4f6f9;
      padding: 40px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.4s ease;
      border-radius: 10px;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 15px;
      opacity: 0;
      transition: opacity 0.4s ease;
      font-size: 1rem;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
    }

    .gallery-item:hover .caption {
      opacity: 1;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>My Photo Gallery</h1>
  <div class="gallery">
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1015/600/400" alt="Nature 1">
      <div class="caption">Beautiful Landscape</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1025/600/400" alt="Nature 2">
      <div class="caption">Sunny Beach</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1035/600/400" alt="Nature 3">
      <div class="caption">Mountain View</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1040/600/400" alt="Nature 4">
      <div class="caption">City Lights</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1050/600/400" alt="Nature 5">
      <div class="caption">Serene Lake</div>
    </div>
    <div class="gallery-item">
      <img src="https://picsum.photos/id/1060/600/400" alt="Nature 6">
      <div class="caption">Forest Path</div>
    </div>
  </div>
</body>
</html>
