<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Responsive YouTube iframe - HTML only</title>
</head>
<body>
  <h2>Pure-HTML (width/height attributes in % — may be unreliable)</h2>

  <!-- Parent table provides a percent width; iframe height is percent of the table cell's height.
       Note: The table cell requires an explicit height from outer context for percentage height to work reliably. -->
  <table width="90%" border="0" cellpadding="0" cellspacing="0">
    <tr>
      <!-- Best-effort: set a relative height here (browser-dependent) -->
      <td height="360">
        <iframe
          width="100%" 
          height="56.25%" 
          src="https://www.youtube.com/embed/dQw4w9WgXcQ"
          title="YouTube video player"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </td>
    </tr>
  </table>

  <p>Resize the browser — behavior depends on browser handling of percentage heights.</p>
</body>
</html>
