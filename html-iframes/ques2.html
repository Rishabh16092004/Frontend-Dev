<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embedded Google Map - New Delhi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <h2>Map: New Delhi, India</h2>
  <iframe
    title="Map showing New Delhi, India"
    src="https://www.google.com/maps?q=New+Delhi,+India&output=embed"
    width="100%"
    height="450"
    loading="lazy"
    frameborder="0">
  </iframe>
</body>
</html>
