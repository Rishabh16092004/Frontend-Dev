<!doctype html>
<html lang="en">
<head>
  <!-- The <title> tag sets the title of the web page shown in the browser tab -->
  <title>Complete Head Example</title>

  <!-- The <meta charset> defines the character encoding for the document -->
  <meta charset="UTF-8">

  <!-- The <meta name="description"> provides a short description of the page for search engines -->
  <meta name="description" content="This page demonstrates important HTML head elements.">

  <!-- The <meta name="author"> specifies the author of the document -->
  <meta name="author" content="Your Name">

  <!-- The <base> tag sets a base URL for all relative links on the page -->
  <base href="https://example.com/">

  <!-- The <link> tag is used to link external resources like stylesheets or favicons -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- The <style> tag contains internal CSS styling -->
  <style>
    body {
      font-family: Arial, sans-serif;
    }
  </style>

  <!-- The <script> tag is used to include JavaScript code -->
  <script>
    // Example: JavaScript code can go here
    console.log("Head section loaded successfully");
  </script>
</head>
<body>
  <h2>Complete &lt;head&gt; Section Example</h2>
  <p>This webpage demonstrates the essential elements used inside the HTML head section.</p>
</body>
</html>
