<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface Layout</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>
<header>
    <h1>Mini UI Dashboard</h1>
</header>

<main>
    <section class="card">
        <div class="image-section">
            <img src="https://cdn-icons-png.flaticon.com/128/16470/16470836.png" alt="Sample UI Image">
        </div>

        <form class="user-form">
            <h2>Sign In</h2>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">

            <div class="btn-group">
                <button type="submit" class="btn primary">Login</button>
                <button type="reset" class="btn outline">Reset</button>
            </div>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2025 Mini UI Design | All Rights Reserved</p>
</footer>
</body>
</html>
