<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interface Components</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
<header>
    <h1>UI Components Showcase</h1>
    <p>Search bar, buttons, and dropdown demo</p>
</header>

<main>
    <section class="ui-card">
        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search...">
            <button class="btn primary">Search</button>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
        </div>

        <!-- Dropdown -->
        <div class="dropdown">
            <label for="options">Choose an option:</label>
            <select id="options" class="dropdown-menu">
                <option value="">Select...</option>
                <option value="ui">UI Design</option>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
            </select>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2025 UI Components Showcase | All Rights Reserved</p>
</footer>
</body>
</html>
