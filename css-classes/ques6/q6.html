<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
<header>
    <h1>CSS Animation Demonstration</h1>
    <p>Examples of keyframe animations with timing and direction</p>
</header>

<main class="animation-area">
    <div class="animation-box move-box">
        <p>Moving Box</p>
    </div>

    <div class="animation-box bounce-ball">

    </div>

    <div class="animation-box color-text">
        <h2 class="animated-text">Color Changing Text</h2>
    </div>
</main>
