<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
<header>
    <h1>Image Showcase Gallery</h1>
    <p class="subtitle">Hover over the images to see the effects</p>
</header>

<main>
    <section class="gallery">
        <figure class="image-card">
            <img src="https://picsum.photos/id/1015/400/300" alt="Mountain view">
            <figcaption>Peaceful Mountain View</figcaption>
        </figure>
        <figure class="image-card">
            <img src="https://picsum.photos/id/1025/400/300" alt="Eagle in flight">
            <figcaption>Majestic Eagle</figcaption>
        </figure>
        <figure class="image-card">
            <img src="https://picsum.photos/id/1035/400/300" alt="Ocean waves">
            <figcaption>Calm Ocean Waves</figcaption>
        </figure>
        <figure class="image-card">
            <img src="https://picsum.photos/id/1045/400/300" alt="Desert dunes">
            <figcaption>Golden Desert Dunes</figcaption>
        </figure>
        <figure class="image-card">
            <img src="https://picsum.photos/id/1055/400/300" alt="Forest trail">
            <figcaption>Forest Walking Trail</figcaption>
        </figure>
        <figure class="image-card">
            <img src="https://picsum.photos/id/1065/400/300" alt="City skyline">
            <figcaption>City Skyline at Dusk</figcaption>
        </figure>
    </section>
</main>

<footer>
    <p>&copy; 2025 Image Showcase | All rights reserved.</p>
</footer>
</body>
</html>
